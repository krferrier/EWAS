# Input data
############################
mvals: "data/mvals.csv.gz"
pheno: "data/pheno.csv"

# EWAS model parameters
############################
association_variable: "BMI"
stratified_ewas: "yes" # yes or no
stratify_variables: ["sex"] # If yes, list which variable(s) to stratify on

# Differentially Methylated Region (DMR) Analysis 
#################################################
dmr_analysis: "yes" # yes or no
min_pvalue: 1.0e-4 # P-value threshold for beginning a region. Must have at least 1 decimal.
window_size: 200 # extend region if another p-value within this distance is found
region_filter: 0.05 # post-filter reported regions

# DMR annotation
##################
genome_build: "hg38" # genome build from USCS
annotation:
  method: local
  gene_table: refGene
  # Use "latest" during active development.
  # For a manuscript/reproducible release, set this to a fixed date like "2026-06-08".
  cache_tag: latest
  ucsc_database_base: "https://hgdownload.soe.ucsc.edu/goldenPath"
  ucsc_gbdb_base: "https://hgdownload.soe.ucsc.edu/gbdb"
  hgnc_complete_set_url: "https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt"

# EWAS (CpG-level) annotation
##############################
# Zhou lab Infinium annotation: https://zwdzwd.github.io/InfiniumAnnotation
# The zhouserver.research.chop.edu URLs used previously are retired. Gene and
# promoter annotation now comes from zhou-lab/InfiniumAnnotationData on GitHub.
ewas_annotation:
  platform: "EPIC" # EPIC, EPICv2, MSA, HM450, HM27, Mammal40
  # Git tag in zhou-lab/InfiniumAnnotationData. Use "main" to track the latest
  # release; pin to a tag such as "v8.1" for a reproducible run.
  zhou_release: "v8.1"
  # GENCODE release in the manifest filename. Genome specific: hg38 -> v41,
  # hg19 -> v26lift37.
  gencode_release: "v41"
  zhou_raw_base: "https://github.com/zhou-lab/InfiniumAnnotationData/raw"
  cache_dir: "resources/ewas_annotation"
  # CpG islands are called from the UCSC cpgIslandExt cache shared with the DMR
  # rules, because GENCODE v41 no longer carries CGI / CGIposition columns.
  cpg_island_shore_bp: 2000
  cpg_island_shelf_bp: 2000
  bios_eqtm_url: "https://molgenis26.gcc.rug.nl/downloads/biosqtlbrowser/2015_09_02_cis_eQTMsFDR0.05-CpGLevel.txt"
  hgnc_complete_set_url: "https://storage.googleapis.com/public-download-files/hgnc/archive/archive/quarterly/tsv/hgnc_complete_set_2025-07-01.txt"

# Parallelization parameters
############################
chunk_size: 5000 # number of methylation sites per chunk 
processing_type: "cluster" # sequential, multisession, multicore, or cluster
workers: 4 # Number of workers per job

# Output parameters
############################
out_directory: "results_testing/" # Include trailing '/'
out_type: ".csv.gz" # .csv or .csv.gz
