# =============================================================================
# EWAS + DMR workflow configuration
#
# Every setting is tagged so you know how much attention it needs:
#
#   [REQUIRED]  Describes your data or your question. Always set it.
#   [CHECK]     Has a sensible default, but the right value depends on your
#               study design. Read the note before accepting it.
#   [DEFAULT]   Leave alone unless something upstream has changed.
#
# Run from the repo root:  snakemake --configfile config.yml
# =============================================================================


# -----------------------------------------------------------------------------
# Input data                                                          [REQUIRED]
# -----------------------------------------------------------------------------
# mvals: CpG-by-sample matrix of M-values. First column is the CpG identifier;
#        remaining column names must match the sample IDs in `pheno`. The probe
#        IDs must match the array named in annotation.array_platform (see the
#        note there about EPICv2/MSA suffixes).
# pheno: one row per sample, with the association variable, any stratification
#        variables, and all model covariates.
mvals: "data/mvals.csv.gz"
pheno: "data/pheno.csv"


# -----------------------------------------------------------------------------
# EWAS model                                                          [REQUIRED]
# -----------------------------------------------------------------------------
# association_variable: column in `pheno` to test each CpG against.
association_variable: "BMI"

# stratified_ewas: "yes" runs a separate EWAS per stratum and meta-analyses the
#   strata with METAL. "no" runs a single combined model.
#   With "yes" the annotated results key on MarkerName and P-value; with "no"
#   they key on cpgid and bacon.pval.
stratified_ewas: "yes"

# stratify_variables: only used when stratified_ewas is "yes". Listing more than
#   one variable crosses them, so every observed combination becomes a stratum.
stratify_variables: ["sex"]


# -----------------------------------------------------------------------------
# Differentially Methylated Region (DMR) analysis
# -----------------------------------------------------------------------------
# dmr_analysis: "no" skips comb-p and everything downstream of it.   [REQUIRED]
dmr_analysis: "yes"

# comb-p parameters.                                                    [CHECK]
# min_pvalue:    seed threshold -- a region starts at a CpG below this p-value.
#                Must be written with a decimal point (1.0e-4, not 1e-4) so the
#                schema reads it as a number.
# window_size:   extend the region while another qualifying CpG lies within this
#                many bp. Tighten for dense arrays, loosen for sparse ones.
# region_filter: post-filter on the reported region p-value.
min_pvalue: 1.0e-4
window_size: 200
region_filter: 0.05

# DMR plotting. Only applies when dmr_analysis is "yes".
# The manhattan plot is always produced. The two toggles below add files whose
# NUMBER cannot be known in advance -- one locus-zoom plot plus one refGene
# gene table per cluster of significant regions -- so they are not tracked by
# Snakemake and are left off by default. Turn make_zoom on when you want to
# look at individual regions; on a result with many significant regions it can
# produce a lot of files. Stale zoom files from a previous run are cleared each
# time plot_dmrs runs, so what you see always belongs to the current results.
#
# scripts/dmr_plot.R has further cosmetic options (point jitter, zoom
# midlines, gene label size, combined figure dimensions, panel label size).
# They are not surfaced here; edit the script's defaults if you need them.
dmr_plots:
  # Locus-zoom plot + gene track per significant region cluster.         [CHECK]
  make_zoom: "no"
  # Single multi-panel figure combining the manhattan and the zoom plots.
  # Only meaningful with make_zoom: "yes".                               [CHECK]
  make_combined: "no"
  combined_formats: "pdf"

  # Minimum number of CpGs a region needs before it is highlighted and
  # eligible for a zoom plot. 1 includes single-CpG regions.             [CHECK]
  min_probes: 2
  # Upper limit of the manhattan y axis; -1 lets the data set it.      [DEFAULT]
  max_y: -1
  # bp of context on each side of a zoomed cluster, and the largest gap in bp
  # between regions still grouped into one zoom window.                [DEFAULT]
  zoom_padding: 2000
  cluster_gap: 3000


# -----------------------------------------------------------------------------
# Genome build                                                        [REQUIRED]
# -----------------------------------------------------------------------------
# Selects both the UCSC tracks and the Zhou manifest. If you change this, also
# change annotation.gencode_release below -- they are tied together.
genome_build: "hg38"


# -----------------------------------------------------------------------------
# Annotation resources                                                 [DEFAULT]
# -----------------------------------------------------------------------------
# Every downloaded annotation file lives under one cache root, subdivided by
# source because each is versioned differently:
#
#   <cache_dir>/zhou/<array_platform>/<zhou_release>/   Zhou Infinium manifest
#   <cache_dir>/ucsc/<genome_build>/<cache_tag>/        UCSC tracks
#   <cache_dir>/eqtm/                                   BIOS eQTM + HGNC
#
# The whole block may be deleted; helper_fxns.ConfigWizard supplies these same
# values as defaults. It is spelled out here so the provenance is visible.
annotation:
  cache_dir: "resources/annotation"

  # -- Zhou Infinium annotation (CpG-level gene/promoter annotation) --
  # array_platform must match the probe IDs in `mvals`.               [REQUIRED]
  #   EPIC, HM450, HM27, Mammal40 -> bare IDs      (cg00000029)
  #   EPICv2, MSA                 -> suffixed IDs  (cg00000029_TC21)
  # All platforms share the same 10-column manifest schema, but if your matrix
  # has stripped the EPICv2/MSA suffix the join will silently miss; annotation.R
  # warns when the match rate is low.
  array_platform: "EPIC"

  # Git tag in zhou-lab/InfiniumAnnotationData. "main" tracks the latest
  # release; pin to a tag such as "v8.1" for a reproducible run.       [DEFAULT]
  zhou_release: "v8.1"

  # GENCODE release in the manifest filename, tied to genome_build:    [CHECK]
  #   hg38 -> v41   hg19 -> v26lift37   mm10 -> vM25   mm39 -> vM31
  gencode_release: "v41"

  zhou_raw_base: "https://github.com/zhou-lab/InfiniumAnnotationData/raw"

  # -- UCSC tracks (CpG islands for both EWAS and DMR; refGene and HGNC
  #    only when dmr_analysis is "yes") --
  # cache_tag: "latest" re-uses whatever was downloaded first. For a manuscript
  # run, set an ISO date (e.g. "2026-06-08") so the cache path records when the
  # tracks were pulled.                                                  [CHECK]
  cache_tag: "latest"
  gene_table: "refGene"
  ucsc_database_base: "https://hgdownload.soe.ucsc.edu/goldenPath"
  ucsc_gbdb_base: "https://hgdownload.soe.ucsc.edu/gbdb"

  # -- eQTM annotation --                                              [DEFAULT]
  # BIOS whole-blood cis-eQTMs (FDR 0.05), gene symbols resolved against a
  # dated HGNC release so the mapping is reproducible.
  bios_eqtm_url: "https://molgenis26.gcc.rug.nl/downloads/biosqtlbrowser/2015_09_02_cis_eQTMsFDR0.05-CpGLevel.txt"
  hgnc_complete_set_url: "https://storage.googleapis.com/public-download-files/hgnc/archive/archive/quarterly/tsv/hgnc_complete_set_2025-07-01.txt"


# -----------------------------------------------------------------------------
# Functional enrichment of the significant CpG set
# -----------------------------------------------------------------------------
# Three independent tests, each writing its own table under <out>/enrichment/:
#   features  KYCG knowledgebases -- chromatin state, histone marks, TF binding,
#             repeats, PMDs, A/B compartments (uses the same pinned v8.1 release
#             as the annotation)
#   pathways  GO and KEGG via missMethyl, which corrects for the number of
#             probes per gene. Supports 450K, EPIC and EPICv2 only; on any other
#             platform it writes an empty table naming the reason
#   traits    EWAS Atlas published trait associations
#
# The background for all three is the set of CpGs actually tested, never the
# full array manifest. A test that cannot run writes an empty table rather than
# failing the workflow.
enrichment:
  # "no" skips all three.                                             [REQUIRED]
  run: "yes"

  # How the significant (foreground) set is defined.                     [CHECK]
  #   significance: fdr | bonferroni | nominal
  #   threshold:    cutoff applied to the adjusted (or raw, if nominal) p-value
  significance: "fdr"
  threshold: 0.05

  # Ignore features/terms/traits with fewer than this many probes in the
  # background. Small sets give unstable enrichment estimates.            [CHECK]
  min_set_size: 20

  # Which KYCG knowledgebases to test.                                   [CHECK]
  # A short biological selection by default -- not everything the platform
  # publishes (EPIC 17 sets, MSA 32), most of which is either technical
  # (probe type, chemistry, blacklist, CpG density), redundant with another
  # set or with a column the results already carry (CGI duplicates
  # CGIposition; REMCChromHMM and HM are largely nested in ChromHMM), or so
  # large it costs everything else FDR power (TFBSrm is 1188 motifs, 84% of
  # all features tested on EPIC).
  #
  # Add any published set by name, e.g. [ChromHMM, PMD, HM, MetagenePC], or
  # use `all` for everything the platform publishes. Set names and what each
  # one means are in the cached registry -- see the README section on the
  # KYCG knowledgebases.
  knowledgebases:
    - ChromHMM        # 18 chromatin states
    - PMD             # partially methylated domains
    - ABCompartment   # Hi-C A/B compartments
    - rmsk1           # repeat classes
    - ImprintingDMR   # positive control: allele-specific methylation
    - CTCFbind        # methylation-sensitive CTCF binding

  # Summary dot plots in <out>/enrichment/.                              [CHECK]
  # Four plots: the pooled top hits for features, GO/KEGG and traits, plus a
  # fourth showing the strongest feature from each KYCG knowledgebase. That
  # last one exists because TFBSrm alone is ~84% of the features tested, so a
  # pooled ranking is dominated by TF motifs and most knowledgebases never
  # appear; it plots fold enrichment, which is comparable across them.
  # Shows the top `plot_top_n` results by p-value, with point size and
  # transparency carrying how many CpGs or genes drive each result, and solid
  # versus hollow points separating what passes the FDR threshold above from
  # what does not. Non-significant results are shown rather than dropped, so a
  # plot with no solid points tells you there were no findings. The plot is
  # written even when the table is empty -- it then says so.
  make_plots: "yes"
  plot_top_n: 10

  # EWAS Atlas association table, about 100 MB, cached on first use.    [DEFAULT]
  # Note the Atlas is keyed on bare cg identifiers, so trait enrichment will
  # not match EPICv2/MSA results that keep the design suffix.
  ewas_atlas_url: "https://ngdc.cncb.ac.cn/ewas/downloads/batch?file=EWAS_Atlas_associations.tsv"


# -----------------------------------------------------------------------------
# Parallelization                                                         [CHECK]
# -----------------------------------------------------------------------------
# chunk_size:      CpGs per EWAS chunk. Larger uses more memory per worker.
# processing_type: sequential | multisession | multicore | cluster.
#                  Use "cluster" when Snakemake submits to a scheduler,
#                  "multicore" or "multisession" on a single machine 
#                  ("multicore" for linux/Mac, "multisession" for Windows),
#                  "sequential" to debug.
# workers:         workers per job. Keep at or below the cores you give
#                  Snakemake (profiles/default/config.v8+.yaml sets cores to 1 by 
#                  default, but this can be changed by appending `-j <n-cores>` to
#                  your snakemake command).
chunk_size: 5000
processing_type: "cluster"
workers: 4


# -----------------------------------------------------------------------------
# Output                                                              [REQUIRED]
# -----------------------------------------------------------------------------
# out_directory: must end in a trailing slash.
# out_type:      ".csv.gz" is recommended for genome-wide results.
out_directory: "results_testing/"
out_type: ".csv.gz"