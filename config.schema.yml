$schema: "https://json-schema.org/draft/2020-12/schema"

title: "EWAS Snakemake workflow configuration"
description: >
  Validation schema for the EWAS, DMR, annotation, and plotting workflow.

type: object

properties:

  # Input data
  mvals:
    type: string
    minLength: 1
    description: "Path to the CpG-by-sample methylation M-value matrix."

  pheno:
    type: string
    minLength: 1
    description: "Path to the phenotype and covariate table."

  # EWAS model parameters
  association_variable:
    type: string
    minLength: 1
    description: "Phenotype-table column name for the primary EWAS exposure."

  stratified_ewas:
    type: string
    enum:
      - "yes"
      - "no"
    description: "Whether to run EWAS separately within strata."

  stratify_variables:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: >
      Phenotype-table column names used for stratified analyses. Must contain
      at least one variable when stratified_ewas is 'yes'.

  # DMR analysis
  dmr_analysis:
    type: string
    enum:
      - "yes"
      - "no"
    description: "Whether to run the DMR analysis."

  min_pvalue:
    type: number
    exclusiveMinimum: 0
    maximum: 1
    description: >
      CpG-level p-value threshold used to begin or extend a DMR.

  window_size:
    type: integer
    minimum: 1
    description: >
      Maximum genomic distance, in base pairs, between qualifying CpGs within
      a candidate DMR.

  region_filter:
    type: number
    exclusiveMinimum: 0
    maximum: 1
    description: "Post-filter threshold for reported DMRs."

  # DMR annotation
  genome_build:
    type: string
    enum:
      - hg19
      - hg38
    description: "Genome build used for DMR annotation and plotting."

  annotation:
    type: object
    description: >
      Every annotation resource the workflow downloads, sharing one cache root.
      All keys have defaults in helper_fxns.ConfigWizard, so a minimal config
      may omit the whole block.
    properties:
      cache_dir:
        type: string
        minLength: 1
        description: >
          Single cache root. Subdivided by source: zhou/<platform>/<release>,
          ucsc/<genome>/<cache_tag>, and eqtm/.

      cache_tag:
        type: string
        pattern: "^(latest|[0-9]{4}-[0-9]{2}-[0-9]{2})$"
        description: >
          UCSC track cache version. Use 'latest' during development or an
          ISO date such as 2026-06-08 for a fixed reproducible release.

      array_platform:
        type: string
        enum:
          - EPIC
          - EPICv2
          - MSA
          - HM450
          - HM27
          - Mammal40
          - MM285
        description: >
          Infinium platform whose Zhou annotation manifest is fetched. All
          platforms share the same 10-column manifest schema, but EPICv2 and
          MSA probe IDs carry a design suffix (cg00000029_TC21).

      zhou_release:
        type: string
        pattern: "^(main|v[0-9]+(\\.[0-9]+)?)$"
        description: >
          Git tag in zhou-lab/InfiniumAnnotationData. Use 'main' to track the
          latest release or a tag such as v8.1 to freeze it.

      gencode_release:
        type: string
        minLength: 1
        description: >
          GENCODE release in the manifest filename. Genome specific: hg38 uses
          v41, hg19 uses v26lift37, mouse mm10 uses vM25 and mm39 vM31.

      zhou_raw_base:
        type: string
        pattern: "^https://.+"
        description: "Base URL for raw downloads from the Zhou annotation repo."

      gene_table:
        type: string
        minLength: 1
        description: "UCSC gene table used for DMR nearby-gene annotation."

      ucsc_database_base:
        type: string
        pattern: "^https://.+"
        description: "Base URL for UCSC Golden Path database downloads."

      ucsc_gbdb_base:
        type: string
        pattern: "^https://.+"
        description: "Base URL for UCSC gbdb downloads."

      bios_eqtm_url:
        type: string
        pattern: "^https://.+"
        description: "URL for the BIOS cis-eQTM CpG-level table."

      hgnc_complete_set_url:
        type: string
        pattern: "^https://.+"
        description: "URL for the HGNC complete gene-set download."

    additionalProperties: false

  # Functional enrichment of the significant CpG set
  enrichment:
    type: object
    description: >
      Feature, pathway and trait enrichment. All keys have defaults in
      helper_fxns.ConfigWizard, so the block may be omitted.
    properties:
      run:
        type: string
        enum: ["yes", "no"]
        description: "Whether to run the enrichment rules at all."

      significance:
        type: string
        enum:
          - fdr
          - bonferroni
          - nominal
        description: >
          How the significant CpG set is defined. 'fdr' applies
          Benjamini-Hochberg, 'nominal' uses the raw p-value.

      threshold:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: "Cutoff applied to the adjusted (or raw) p-value."

      min_set_size:
        type: integer
        minimum: 1
        description: >
          Ignore features, terms and traits with fewer than this many probes
          in the background set.

      knowledgebases:
        description: >
          KYCG knowledgebases tested for enrichment: a list of set names, or
          the string "all" for everything the configured platform publishes.
          Omit to use the built-in biological selection.
        oneOf:
          - type: string
            enum: ["all"]
          - type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1

      fdr_by_knowledgebase:
        type: string
        enum: ["yes", "no"]
        description: >
          Adjust enrichment p-values within each knowledgebase ("yes") rather
          than as one pooled BH family across all of them ("no").

      ewas_atlas_url:
        type: string
        pattern: "^https://.+"
        description: "URL for the EWAS Atlas association table."

      make_plots:
        type: string
        enum: ["yes", "no"]
        description: >
          Whether to write one summary dot plot per enrichment analysis. The
          plot is produced even when nothing is significant.

      plot_top_n:
        type: integer
        minimum: 1
        description: "Number of results shown in each enrichment plot."

    additionalProperties: false

  # DMR plotting
  dmr_plots:
    type: object
    description: >
      Options for scripts/dmr_plot.R. All keys have defaults in
      helper_fxns.ConfigWizard, so the block may be omitted. Only applies when
      dmr_analysis is "yes".
    properties:
      make_zoom:
        type: string
        enum: ["yes", "no"]
        description: >
          Write a locus-zoom plot and a refGene gene table per cluster of
          significant regions. These files are not tracked by Snakemake
          because their number depends on how many regions comb-p finds.

      make_combined:
        type: string
        enum: ["yes", "no"]
        description: >
          Write a combined multi-panel figure from the manhattan and zoom
          plots. Only meaningful with make_zoom set to "yes".

      combined_formats:
        type: string
        minLength: 1
        description: "Output format(s) for the combined figure, e.g. pdf."

      min_probes:
        type: integer
        minimum: 1
        description: >
          Minimum CpGs in a region before it is highlighted and eligible for
          a zoom plot.

      max_y:
        type: number
        description: >
          Upper limit of the manhattan y axis. -1 lets the data set it.

      zoom_padding:
        type: integer
        minimum: 0
        description: "bp of context on each side of a zoomed cluster."

      cluster_gap:
        type: integer
        minimum: 0
        description: >
          Largest gap in bp between regions still grouped into one zoom
          window.

    additionalProperties: false

  # Parallelization
  chunk_size:
    type: integer
    minimum: 1
    description: "Number of methylation sites processed per EWAS chunk."

  processing_type:
    type: string
    enum:
      - sequential
      - multisession
      - multicore
      - cluster
    description: "Parallelization backend used by the EWAS R script."

  workers:
    type: integer
    minimum: 1
    description: "Number of workers requested per EWAS job."

  # Output settings
  out_directory:
    type: string
    minLength: 2
    pattern: "^.+/$"
    description: "Output directory path, including a trailing slash."

  out_type:
    type: string
    enum:
      - ".csv"
      - ".csv.gz"
    description: "Output table format."

required:
  - mvals
  - pheno
  - association_variable
  - stratified_ewas
  - stratify_variables
  - dmr_analysis
  - min_pvalue
  - window_size
  - region_filter
  - genome_build
  - chunk_size
  - processing_type
  - workers
  - out_directory
  - out_type

# Begin permissively. See note below before changing this to false.
additionalProperties: true

allOf:
  # A stratified analysis must name at least one stratification variable.
  - if:
      properties:
        stratified_ewas:
          const: "yes"
      required:
        - stratified_ewas
    then:
      properties:
        stratify_variables:
          minItems: 1