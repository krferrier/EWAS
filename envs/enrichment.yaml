name: enrichment
channels:
  - bioconda
  - conda-forge
  - r
  - nodefaults
dependencies:
  - r-base
  - r-argparse
  - r-data.table
  - r-dplyr
  # scripts/plot_enrichment.R; label wrapping uses base strwrap so stringr is
  # not needed, matching the other plotting scripts in this workflow.
  - r-ggplot2
  # Feature enrichment reads the v8.1 KYCG knowledgebases through yame rather
  # than knowYourCG. yame's format-6 query carries an explicit universe, so the
  # background is the CpGs actually tested rather than the whole array; it uses
  # the same release the annotation is pinned to instead of a second
  # ExperimentHub cache; and it handles the large sets (TFBSrm: 1188 records in
  # about a second) that would be unusable as an unpacked matrix.
  # GO and KEGG testing. gometh/gsameth correct for the number of probes per
  # gene, a bias ordinary gene-set tests get wrong on array data. This also
  # pulls in the IlluminaHumanMethylation{450k,EPIC,EPICv2}anno packages it
  # needs, which is why pathway enrichment is limited to those three arrays.
  - bioconductor-missmethyl
  # gometh resolves the array annotation through the search list, so these are
  # attached with library() by scripts/enrich_pathways.R. They arrive as
  # missMethyl dependencies but are listed explicitly because the script fails
  # without the specific one matching annotation.array_platform.
  - bioconductor-illuminahumanmethylation450kanno.ilmn12.hg19
  - bioconductor-illuminahumanmethylationepicanno.ilm10b4.hg19
  - bioconductor-illuminahumanmethylationepicv2anno.20a1.hg38
  # reads the .cm knowledgebases
  - yame >=1.40
