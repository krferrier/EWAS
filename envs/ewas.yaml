name: ewas
channels:
  - bioconda
  - conda-forge
  - r
  - nodefaults
dependencies:
  # Core languages
  - r-base

  # R:
  - r-essentials  # includes tidyverse, devtools, Rcpp, etc.
  - r-biocmanager
  # >=1.32.0 (Bioconductor 3.19) is the first release containing the upstreamed
  # initialize() and BiocParallel RNG fixes (mvaniterson/bacon PR #1, 2024-04).
  # scripts/run_bacon.R calls bacon(globalSeed=, parallelSeed=), which only
  # exists from that release on.
  - bioconductor-bacon >=1.32.0
  # reads the KYCG .cm feature sets joined by scripts/annotation.R
  - yame >=1.40
  - bioconductor-biocparallel
  - r-argparse
  - r-qqman
  # r-qcewas removed: its only use was P_lambda(), now defined in
  # scripts/run_bacon.R and scripts/plots.R. conda-forge has no r-qcewas
  # build for R >= 4.4, which bioconductor-bacon >= 1.32 requires.
  - r-caret
  - r-rmarkdown
  - r-shiny
  - r-fst
  - r-dofuture
  - r-progress
  - r-progressr
  - r-foreach
  - r-vars
  - r-tictoc
  - r-cli
  - r-reshape2
  - r-r.utils
  - r-cowplot
  - r-ggplot2
  - r-data.table
  - r-dplyr
  - r-jsonlite
  - r-scales
  - r-svglite



