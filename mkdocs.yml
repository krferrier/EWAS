site_name: EWAS workflow
site_description: Snakemake workflow for epigenome-wide association studies (EWAS) on Illumina methylation arrays.
site_author: Kendra Ferrier
site_url: https://krferrier.github.io/EWAS/
repo_url: https://github.com/krferrier/EWAS
repo_name: krferrier/EWAS
edit_uri: edit/main/docs/
copyright: Licensed under the PolyForm Noncommercial License 1.0.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Workflow overview: workflow.md
  - Running the workflow: usage.md
  - Parameters: parameters.md
  - Outputs: outputs.md
  - Annotation: annotation.md
  - Functional enrichment: enrichment.md
  - Interpreting BACON plots: bacon-plots.md
  - License and acknowledgements: license.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  requirements.txt

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
